name: Build and Sign Play Store AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions to Gradle
        run: chmod +x android/gradlew

      - name: Build Signed Android App Bundle (.aab)
        working-directory: android
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Locate Generated AAB
        id: find-aab
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "Found AAB at: $AAB_PATH"
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          cp "$AAB_PATH" LumenTorch-release-signed.aab

      - name: Upload Signed AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumenTorch-PlayStore-AAB
          path: LumenTorch-release-signed.aab
          retention-days: 30

      - name: Create GitHub Release with Direct Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: LumenTorch Play Store Release v1.0.0
          body: |
            ### LumenTorch Android 13+ Camera2 Torch Controller
            
            This is your signed **Android App Bundle (.aab)** ready to upload directly to Google Play Console:
            - **Target SDK**: Android 14 (API 34)
            - **Min SDK**: Android 13 (API 33)
            - **Signed With**: `release.keystore` (Alias: `lumentorch`)
            - **Google Play Data Safety**: No user data collected or shared.
            
            Download `LumenTorch-release-signed.aab` below and upload to Google Play Console!
          files: LumenTorch-release-signed.aab
          draft: false
          prerelease: false
